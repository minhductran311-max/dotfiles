# foot — Tokyo Night
# ~/.config/foot/foot.ini

font = JetBrainsMono Nerd Font:size=11
pad = 10x10

[main]
# Đổi shell nếu bạn dùng zsh/fish
# shell = /usr/bin/zsh

[scrollback]
lines = 10000

[colors]
alpha = 0.95
background = 1a1b26
foreground = c0caf5

regular0  = 15161e   # black
regular1  = f7768e   # red
regular2  = 9ece6a   # green
regular3  = e0af68   # yellow
regular4  = 7aa2f7   # blue
regular5  = bb9af7   # magenta
regular6  = 7dcfff   # cyan
regular7  = a9b1d6   # white

bright0   = 414868
bright1   = f7768e
bright2   = 9ece6a
bright3   = e0af68
bright4   = 7aa2f7
bright5   = bb9af7
bright6   = 7dcfff
bright7   = c0caf5

selection-foreground = c0caf5
selection-background = 292e42

flash = e0af68

[csd]
# Tắt thanh tiêu đề CSD — để sway tự vẽ border vuông sắc
preferred = none
