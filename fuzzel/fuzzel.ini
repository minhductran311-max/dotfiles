# ~/.config/fuzzel/fuzzel.ini - Tokyo Night
# font gionh foot; mau dang RGBA (RRGGBBAA - 2 so cuoi la do trong suot)

[main]
font=JetBrainsMono Nerd Font:size=11
dpi-aware=no
terminal=foot
icons-enabled=yes
icon-theme=hicolor
fields=name,generic,comment,exec
filter-desktop=yes
layer=top
exit-on-keyboard-focus-loss=yes
minimal-lines=yes
width=55
horizontal-pad=20
vertical-pad=12
inner-pad=6

[colors]
background=1a1b26e6
text=c0caf5ff
input=c0caf5ff
prompt=7aa2f7ff
placeholder=565f89ff
match=bb9af7ff
selection=292e42ff
selection-text=c0caf5ff
selection-match=7aa2f7ff
border=7aa2f7ff

[border]
width=2
radius=0
selection-radius=0
